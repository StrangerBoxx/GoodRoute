<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada · Control Position</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <!-- GitHub Pages sirve esta página para cualquier dirección que no existe,
       también dentro de subcarpetas: por eso los estilos van acá adentro y
       la raíz del sitio (logo, favicon, "Volver al inicio") se calcula abajo
       en vez de usar rutas relativas. Mismos tokens que app/styles.css. -->
  <style>
    :root {
      --bg: #FBF6F6; --surface: #ffffff; --border: #ece4e4;
      --text: #1c1a1b; --text-2: #635f60; --text-3: #938d8e;
      --accent: #033E84; --accent-strong: #022c5f; --accent-soft: #e3ebf5;
      --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px 32px 32px; box-shadow: 0 2px 8px rgba(40,30,30,.06); text-align: center;
    }
    .logo { height: 40px; width: auto; display: block; margin: 0 auto 28px; }
    .code { font-family: var(--mono); font-size: 56px; font-weight: 600; line-height: 1; color: var(--accent); letter-spacing: -1px; }
    h1 { font-size: 19px; font-weight: 600; margin: 14px 0 8px; }
    p { font-size: 13.5px; line-height: 1.55; color: var(--text-2); margin: 0 0 24px; }
    .ruta {
      font-family: var(--mono); font-size: 12px; color: var(--text-3); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; margin: -8px 0 24px;
      overflow-wrap: anywhere;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 9px;
      background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 600; text-decoration: none;
      transition: background .12s;
    }
    .btn:hover { background: var(--accent-strong); }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 5px var(--accent); }
    .btn svg { width: 16px; height: 16px; }
    @media (max-width: 420px) { .card { padding: 28px 20px 24px; } .code { font-size: 46px; } }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" id="logo" alt="Control Position" />
    <div class="code">404</div>
    <h1>No encontramos esta página</h1>
    <p>La dirección no existe o cambió. Revisa que esté bien escrita o vuelve al inicio del back office.</p>
    <div class="ruta" id="ruta" hidden></div>
    <a class="btn" id="inicio" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Volver al inicio
    </a>
  </main>
  <script>
    // En GitHub Pages el sitio vive en /<repo>/ (ej. /GoodRoute/); en un
    // servidor local, en la raíz.
    var raiz = location.hostname.endsWith(".github.io") ? "/" + location.pathname.split("/")[1] + "/" : "/";
    document.getElementById("inicio").href = raiz;
    document.getElementById("logo").src = raiz + "app/logo-control_position.svg";
    var icono = document.createElement("link");
    icono.rel = "icon"; icono.type = "image/png"; icono.href = raiz + "app/favicon.png";
    document.head.appendChild(icono);
    var ruta = document.getElementById("ruta");
    // decodeURIComponent falla con una dirección mal codificada (ej. "%E0"):
    // en ese caso se muestra tal cual llegó.
    try { ruta.textContent = decodeURIComponent(location.pathname); } catch (e) { ruta.textContent = location.pathname; }
    ruta.hidden = false;
  </script>
</body>
</html>

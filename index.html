<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backoffice · Control Position</title>
  <link rel="icon" type="image/png" href="app/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Mapa de la ruta (Asignación de rutas → Asignaciones registradas): Leaflet + mosaicos de OpenStreetMap, sin API key. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link rel="stylesheet" href="app/styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- Recharts (UMD) referencia PropTypes como global externo. -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" integrity="sha384-/AfDwVDXNopzPvhxMPQ11y1OCpR6mVkWx47qzSwIiquvxkcMkZddEzDNtIOtfCpk" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" integrity="sha384-d1XH4LhwLW8j0l6VXMP8yJabdGY9ZqtZk7k7PaPk5NoUCcZ/hDkL5aaKioKQbcZg" crossorigin="anonymous"></script>
  <!-- Exportar a PDF (Dashboard de análisis): pdfmake arma el documento
       como árbol de texto/tablas vectoriales, no una captura de pantalla.
       vfs_fonts trae la fuente Roboto embebida. -->
  <script src="https://unpkg.com/pdfmake@0.2.10/build/pdfmake.min.js" integrity="sha384-vseuUuO/VRMn00lXYd5m/Pk4l/7RjMqhXGf6G0RALy+On0txYb39dQsUQDAd7q5L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/pdfmake@0.2.10/build/vfs_fonts.js" integrity="sha384-zmD5tDN2awbMigS/yVcxHObSsdXXKh/27Y/bSII38WfNl+D7O/aVCIteAXsLY3p3" crossorigin="anonymous"></script>
  <!-- Exportar a Excel (Dashboard de análisis): ExcelJS arma el libro
       con hojas/estilos reales y permite incrustar el gráfico (como
       imagen rasterizada, igual que en el PDF) dentro de la hoja. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" integrity="sha384-Pqp51FUN2/qzfxZxBCtF0stpc9ONI6MYZpVqmo8m20SoaQCzf+arZvACkLkirlPz" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>

  <script src="app/data.js"></script>
  <script src="app/logo.js"></script>
  <script src="app/rutas-externo/data.js"></script>
  <script src="app/rutas-externo/optimizer.js"></script>

  <script type="text/babel" src="app/rutas-externo/RutasExterno.jsx"></script>
  <script type="text/babel" src="app/rutas-externo/configuracion.jsx"></script>
  <script type="text/babel" src="app/auth.jsx"></script>
  <script type="text/babel" src="app/evidence.jsx"></script>
  <script type="text/babel" src="app/layout.jsx"></script>
  <script type="text/babel" src="app/dashboard.jsx"></script>
  <script type="text/babel" src="app/dashboard-analisis/DashboardAnalisis.jsx"></script>
  <script type="text/babel" src="app/orders.jsx"></script>

  <script type="text/babel" src="app/installations.jsx"></script>
  <script type="text/babel" src="app/settings.jsx"></script>
  <script type="text/babel" src="app/tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/main.jsx"></script>
</body>
</html>
